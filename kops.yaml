apiVersion: kops.k8s.io/v1alpha2
kind: Cluster
metadata:
  name: k8s.andrw.tech
spec:
  api:
    dns: {}
  authorization:
    rbac: {}
  channel: stable
  cloudProvider: aws
  configBase: s3://kops-config-algo-trading/k8s.andrw.tech
  dnsZone: k8s.andrw.tech
  etcdClusters:
  - cpuRequest: 200m
    etcdMembers:
    - encryptedVolume: true
      instanceGroup: control-plane-us-east-1a
      name: a
    manager:
      backupRetentionDays: 90
    memoryRequest: 100Mi
    name: main
  - cpuRequest: 100m
    etcdMembers:
    - encryptedVolume: true
      instanceGroup: control-plane-us-east-1a
      name: a
    manager:
      backupRetentionDays: 90
    memoryRequest: 100Mi
    name: events
  iam:
    allowContainerRegistry: true
    legacy: false
  addons:
  - manifest: s3://kops-config-algo-trading/addons/addons.yaml
  additionalPolicies:
    node: |
      [
        {
          "Effect": "Allow",
          "Action": ["ssm:GetParameter", "ssm:GetParameters"],
          "Resource": ["arn:aws:ssm:us-east-1:299897922160:parameter/atp/*"]
        },
        {
          "Effect": "Allow",
          "Action": ["kms:Decrypt"],
          "Resource": ["arn:aws:kms:us-east-1:299897922160:key/31759851-01a7-44cd-ac2e-e1637b582344"]
        }
      ]
    master: |
      [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject"],
          "Resource": ["arn:aws:s3:::kops-config-algo-trading/addons/*"]
        }
      ]
  kubeProxy:
    enabled: false
  kubelet:
    anonymousAuth: false
  kubernetesApiAccess:
  - 0.0.0.0/0
  - ::/0
  kubernetesVersion: 1.31.14
  masterPublicName: api.k8s.andrw.tech
  networkCIDR: 172.20.0.0/16
  networking:
    cilium:
      enableNodePort: true
  nonMasqueradeCIDR: 100.64.0.0/10
  sshAccess:
  - 0.0.0.0/0
  - ::/0
  subnets:
  - cidr: 172.20.0.0/16
    name: us-east-1a
    type: Public
    zone: us-east-1a
  topology:
    dns:
      type: Public
---
apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: control-plane-us-east-1a
  labels:
    kops.k8s.io/cluster: k8s.andrw.tech
spec:
  role: Master
  machineType: t3.small
  minSize: 1
  maxSize: 1
  zones:
  - us-east-1a
  subnets:
  - us-east-1a
---
apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: nodes
  labels:
    kops.k8s.io/cluster: k8s.andrw.tech
spec:
  role: Node
  machineType: t2.micro
  minSize: 3
  maxSize: 3
  zones:
  - us-east-1a
  subnets:
  - us-east-1a
---
apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: kafka-nodes
  labels:
    kops.k8s.io/cluster: k8s.andrw.tech
spec:
  role: Node
  machineType: t3.small
  minSize: 3 # 1 isn't enough. 2 may suffice?
  maxSize: 3
  zones:
  - us-east-1a
  subnets:
  - us-east-1a
  nodeLabels:
    dedicated: kafka
  taints:
  - dedicated=kafka:NoSchedule
